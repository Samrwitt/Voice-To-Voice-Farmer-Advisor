<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Advisor RAG Test Console</title>
  <link rel="stylesheet" href="/static/smart_advisor.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <div>
        <p class="eyebrow">Voice Farmer Advisor</p>
        <h1>Smart Advisory RAG Test Console</h1>
        <p class="subtle">
          Chat with the same <code>/rag/answer</code> endpoint used by VAD/SIP and inspect scenario routing,
          tool use, retrieval, clarification, and grounding.
        </p>
      </div>
      <div class="status-card">
        <span id="serviceStatus" class="status-dot">Checking...</span>
        <small>Endpoint: <code>/rag/answer</code></small>
      </div>
    </section>

    <section class="settings panel">
      <label>
        Phone number
        <input id="phoneNumber" value="+251911000001" autocomplete="off">
      </label>
      <label>
        Session ID
        <input id="sessionId" autocomplete="off">
      </label>
      <label>
        Debug token, optional
        <input id="debugToken" type="password" placeholder="RAG_METRICS_TOKEN if configured">
      </label>
      <button id="newSessionBtn" type="button">New Session</button>
    </section>

    <section class="layout">
      <aside class="panel test-panel">
        <div class="panel-title">
          <h2>Test Cases</h2>
          <button id="runChecklistBtn" type="button">Run Checklist</button>
        </div>
        <div id="testCases" class="test-list"></div>
      </aside>

      <section class="panel chat-panel">
        <div id="messages" class="messages" aria-live="polite"></div>
        <form id="chatForm" class="composer">
          <textarea id="queryInput" rows="3" placeholder="Ask a farmer advisory question..."></textarea>
          <div class="composer-actions">
            <button id="inspectBtn" type="button">Inspect Context</button>
            <button type="submit">Send</button>
          </div>
        </form>
      </section>

      <aside class="panel inspector">
        <div class="panel-title">
          <h2>Smart Signals</h2>
          <button id="clearBtn" type="button">Clear</button>
        </div>
        <div id="signalSummary" class="signal-grid"></div>
        <h3>Tool Trace</h3>
        <div id="toolTrace" class="chips"></div>
        <h3>References</h3>
        <div id="references" class="references"></div>
        <h3>Raw Debug</h3>
        <pre id="rawDebug">{}</pre>
      </aside>
    </section>
  </main>

  <script src="/static/smart_advisor.js"></script>
</body>
</html>
