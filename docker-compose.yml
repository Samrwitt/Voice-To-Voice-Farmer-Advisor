services:
  base:
    image: farmer-advisor-base
    build:
      context: .
      dockerfile: Dockerfile.base
    command: ["echo", "Base image built"]

  postgres:
    image: postgres:16
    container_name: phone_gateway_postgres
    environment:
      POSTGRES_DB: phone_gateway_db
      POSTGRES_USER: phone_user
      POSTGRES_PASSWORD: phone_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  phone-gateway:
    build:
      context: .
      dockerfile: phone_gateway/Dockerfile
    container_name: phone_gateway_backend
    depends_on:
      - postgres
      - vad-service
    environment:
      DATABASE_URL: postgresql://phone_user:phone_pass@postgres:5432/phone_gateway_db
      RECORDINGS_DIR: /app/recordings
      VAD_WS_BASE_URL: ws://vad-service:8010/ws/vad

      CREATE_DEFAULT_ADMIN: "true"
      DEFAULT_ADMIN_NAME: "System Admin"
      DEFAULT_ADMIN_EMAIL: "admin@example.com"
      DEFAULT_ADMIN_PASSWORD: "admin123"
      RESET_DEFAULT_ADMIN_PASSWORD: "false"
    ports:
      - "8000:8000"
    volumes:
      - call_recordings:/app/recordings

  pgadmin:
    image: dpage/pgadmin4
    container_name: phone_gateway_pgadmin
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin_servers.json:/pgadmin4/servers.json

  vad-service:
    build:
      context: .
      dockerfile: vad_service/Dockerfile
    container_name: vad_service
    depends_on:
      base:
        condition: service_completed_successfully
      asr-service:
        condition: service_started
    ports:
      - "8010:8010"
    environment:
      ASR_HTTP_URL: http://asr-service:8001/transcribe-file
      VAD_UTTERANCES_DIR: /app/utterances
      MAX_CONCURRENT_ASR: 2
    volumes:
      - vad_utterances:/app/utterances


  asr-service:
    build:
      context: .
      dockerfile: asr_service/Dockerfile
    container_name: asr_service
    ports:
      - "8001:8001"
    environment:
      ASR_ENGINE: whisper_local
      ASR_MODEL_PATH: /models/asr/whisper-small-amharic-bdu-8khz-aug-ct2-fp16
      SHARED_UTTERANCES_DIR: /shared/utterances
      ASR_USE_OLLAMA: "true"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b
    depends_on:
      - ollama
    volumes:
      - vad_utterances:/shared/utterances:ro
      - ./models/asr:/models/asr:ro

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]



  tts-service:
    build:
      context: .
      dockerfile: tts_service/Dockerfile
    container_name: tts_service
    depends_on:
      base:
        condition: service_completed_successfully
    ports:
      - "8003:8000"

  admin-dashboard:
    image: farmer-advisor-admin-dashboard
    build:
      context: ./admin_dashboard_frontend
      dockerfile: Dockerfile
    container_name: admin_dashboard
    depends_on:
      - logic-service
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1

      # Server-side proxy: Next.js API routes forward /api/admin/* here
      LOGIC_SERVICE_URL: http://logic-service:8002

      # Kept for any remaining browser-side references (login redirect, etc.)
      NEXT_PUBLIC_API_URL: http://localhost:8000

  logic-service:
    image: farmer-advisor-logic-service
    build:
      context: .
      dockerfile: logic_service/Dockerfile
    container_name: logic_service
    depends_on:
      base:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://phone_user:phone_pass@postgres:5432/phone_gateway_db
      LOG_LEVEL: INFO

      # Shared with phone-gateway so JWTs are mutually verifiable
      JWT_SECRET_KEY: "change-this-secret-key-in-production"
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"

      # Default admin seeded into shared dashboard_users table
      CREATE_DEFAULT_ADMIN: "true"
      DEFAULT_ADMIN_NAME: "System Admin"
      DEFAULT_ADMIN_EMAIL: "admin@example.com"
      DEFAULT_ADMIN_PASSWORD: "admin123"
      RESET_DEFAULT_ADMIN_PASSWORD: "false"

      # Service health probes used by /admin/system-status
      VAD_HEALTH_URL: "http://vad-service:8010/health"
      ASR_HEALTH_URL: "http://asr-service:8001/docs"
      TTS_URL: "http://tts-service:8000/synthesize"
      TTS_HEALTH_URL: "http://tts-service:8000/docs"
      PHONE_GATEWAY_URL: "http://phone-gateway:8000/health"

      DATA_DIR: "/app/data"
    volumes:
      - logic_data:/app/data


volumes:
  postgres_data:
  call_recordings:
  pgadmin_data:
  vad_utterances:
  ollama_data:

  logic_data:
