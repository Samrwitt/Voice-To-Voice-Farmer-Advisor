services:
  base:
    image: farmer-advisor-base
    build:
      context: .
      dockerfile: Dockerfile.base
    command: [ "echo", "Base image built" ]

  postgres:
    # pgvector-enabled Postgres (required for fast KB retrieval)
    image: pgvector/pgvector:pg16
    container_name: phone_gateway_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: farmer_advisor_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  rag-service:
    build:
      context: rag_service
      dockerfile: Dockerfile
    container_name: rag_service
    depends_on:
      postgres:
        condition: service_started
    ports:
      - "8004:8000"
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RAG_PG_MAX_L2_DISTANCE: "1.35"
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b
      RAG_ASSISTANT_LLM: "1"
      RAG_PG_RETRIEVE_POOL: "40"
      RAG_PG_FINAL_TOP_K: "6"
      RAG_PG_BM25: "1"
      RAG_PG_TOPIC_REFINE: "1"
      RAG_TOOLS: "1"
      RAG_WEB_MODE: "off"
      RAG_WEB_ALLOW: "1"
      RAG_WEATHER_TOOL: "1"
      TTS_URL: http://tts-service:8009/synthesize
      AUTO_INGEST_KB_DIR: /app/kb_documents/amharic
      AUTO_INGEST_KB_DIRS: /app/kb_documents/amharic,/app/RAG/KB
      AUTO_INGEST_ON_STARTUP: "true"
      FORCE_REINDEX_KB: "false"
      AUTO_INGEST_MAX_FILES: "100"
      RAG_CHROMA_RETRIEVE: "0"
      RAG_CHROMA_MIRROR: "0"
      EMBED_BATCH_SIZE: "8"
      HF_TOKEN: ${HF_TOKEN}
      HF_HUB_ETAG_TIMEOUT: "60"
      HF_HUB_DOWNLOAD_TIMEOUT: "60"
      HF_HOME: /models/huggingface
      HF_HUB_CACHE: /models/huggingface/hub
      SENTENCE_TRANSFORMERS_HOME: /models/sentence_transformers
      KB_EMBEDDING_MODEL: /models/sentence_transformers/sentence-transformers_paraphrase-multilingual-MiniLM-L12-v2
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      RAG_MERGED_JSON: /app/RAG/merged.json
      RAG_MERGED_SYNC: "true"
      ESCALATION_SLA_HOURS: "48"
      CALL_RECORDING_RETENTION_DAYS: "30"
      RAG_AGROCHEM_EXPERT_ONLY: "1"
      RAG_VOICE_LOW_CONF_ESCALATE: "1"
      RAG_RESPONSE_CACHE_TTL_SEC: "120"
      RAG_RESPONSE_CACHE_MAX: "512"
      RAG_SMART_PIPELINE: ${RAG_SMART_PIPELINE:-1}
      RAG_SMART_FINAL_BACKEND: ${RAG_SMART_FINAL_BACKEND:-gemini}
      RAG_LLM_BACKEND: ${RAG_LLM_BACKEND:-gemini}
      GROQ_API_KEYS: ${GROQ_API_KEYS:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_GEMINI_FALLBACK: ${GROQ_GEMINI_FALLBACK:-1}
      RAG_API_KEY_COOLDOWN_SEC: ${RAG_API_KEY_COOLDOWN_SEC:-90}
      TQDM_DISABLE: "1"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - ./kb_documents:/app/kb_documents:ro
      - ./RAG:/app/RAG:ro
      - ./models:/models

  phone-gateway:
    build:
      context: .
      dockerfile: phone_gateway/Dockerfile
    container_name: phone_gateway_backend
    depends_on:
      postgres:
        condition: service_started
      vad-service:
        condition: service_started
      tts-service:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RECORDINGS_DIR: /app/recordings
      VAD_WS_BASE_URL: ws://vad-service:8010/ws/vad
      TTS_SERVICE_URL: http://tts-service:8009/synthesize
      SIP_AUDIOSOCKET_ENABLED: "true"
      SIP_AUDIOSOCKET_HOST: 0.0.0.0
      SIP_AUDIOSOCKET_PORT: "9092"
      SIP_AUDIOSOCKET_SAMPLE_RATE: "8000"
      SIP_PLAY_OPENING_GREETING: "true"
      SIP_AUDIO_LOG_EVERY: "0"
      SIP_EVENT_LOGS: "1"
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: farmer-advisor-media

      CREATE_DEFAULT_ADMIN: "true"
      DEFAULT_ADMIN_NAME: "System Admin"
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      RESET_DEFAULT_ADMIN_PASSWORD: "false"
    ports:
      - "8000:8000"
    expose:
      - "9092"
    volumes:
      - call_recordings:/app/recordings
      - vad_utterances:/app/utterances:ro

  sip-gateway:
    build:
      context: phone_gateway/asterisk
      dockerfile: Dockerfile
    container_name: farmer_advisor_sip_gateway
    depends_on:
      phone-gateway:
        condition: service_started
    ports:
      - "5062:5060/udp"
      - "5062:5060/tcp"
      - "10000-10050:10000-10050/udp"

  pgadmin:
    image: dpage/pgadmin4
    container_name: phone_gateway_pgadmin
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin_servers.json:/pgadmin4/servers.json

  vad-service:
    build:
      context: .
      dockerfile: vad_service/Dockerfile
    container_name: vad_service
    depends_on:
      base:
        condition: service_completed_successfully
      asr-service:
        condition: service_started
    ports:
      - "8010:8010"
    environment:
      ASR_HTTP_URL: http://asr-service:8001/transcribe-file
      RAG_SERVICE_URL: http://rag-service:8000
      TTS_SERVICE_URL: http://tts-service:8009
      VAD_UTTERANCES_DIR: /app/utterances
      VAD_TTS_MAX_SENTENCES: "1"
      VAD_TTS_MAX_CHARS: "220"
      VAD_AUDIO_LOG_EVERY: "0"
      MAX_CONCURRENT_ASR: 2
    volumes:
      - vad_utterances:/app/utterances

  asr-service:
    build:
      context: .
      dockerfile: asr_service/Dockerfile
    container_name: asr_service
    ports:
      - "8001:8001"
    environment:
      ASR_ENGINE: ${ASR_ENGINE:-whisper_local}
      ASR_MODEL_PATH: ${ASR_MODEL_PATH:-/models/asr/whisper-small-amharic-bdu-8khz-aug-ct2-fp16}
      SHARED_UTTERANCES_DIR: /shared/utterances
      ASR_HOSTED_LLM_FIX: ${ASR_HOSTED_LLM_FIX:-auto}
      ASR_LLM_FIX_BACKEND: ${ASR_LLM_FIX_BACKEND:-gemini}
      GROQ_API_KEYS: ${GROQ_API_KEYS:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      FREE_GEMINI_API_KEYS: ${FREE_GEMINI_API_KEYS:-}
      FREE_GEMINI_API_KEY: ${FREE_GEMINI_API_KEY:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ASR_USE_SHARED_GEMINI_KEYS: ${ASR_USE_SHARED_GEMINI_KEYS:-0}
      ASR_LLM_FIX_MAX_KEYS_PER_REQUEST: ${ASR_LLM_FIX_MAX_KEYS_PER_REQUEST:-1}
      ASR_USE_OLLAMA: ${ASR_USE_OLLAMA:-false}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b
    depends_on:
      - ollama
    volumes:
      - vad_utterances:/shared/utterances:ro
      - ./models/asr:/models/asr

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]



  tts-service:
    build:
      context: .
      dockerfile: tts_service/Dockerfile
    container_name: tts_service
    depends_on:
      base:
        condition: service_completed_successfully
    ports:
      - "8009:8009"
    environment:
      TTS_ATEMPO: "1.5"
      TTS_VOLUME: "1.5"

  admin-dashboard:
    image: farmer-advisor-admin-dashboard
    build:
      context: ./admin_dashboard_frontend
      dockerfile: Dockerfile
    container_name: admin_dashboard
    depends_on:
      - logic-service
    ports:
      # Host 3000 is often taken (other Next.js, Grafana, etc.). Override: ADMIN_DASHBOARD_PORT=3000
      - "${ADMIN_DASHBOARD_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1

      # Server-side proxy: Next.js API routes forward /api/admin/* here
      LOGIC_SERVICE_URL: http://logic-service:8002

      # Kept for any remaining browser-side references (login redirect, etc.)
      NEXT_PUBLIC_API_URL: http://localhost:8000

  logic-service:
    image: farmer-advisor-logic-service
    build:
      context: .
      dockerfile: logic_service/Dockerfile
    container_name: logic_service
    depends_on:
      base:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LOG_LEVEL: INFO
      TTS_URL: http://tts-service:8009/synthesize

      HF_HOME: /models/huggingface
      HF_HUB_CACHE: /models/huggingface/hub
      SENTENCE_TRANSFORMERS_HOME: /models/sentence_transformers
      HF_TOKEN: ${HF_TOKEN}
      HF_HUB_ETAG_TIMEOUT: "60"
      HF_HUB_DOWNLOAD_TIMEOUT: "60"
      CHROMA_EMBEDDING_MODEL: /models/sentence_transformers/sentence-transformers_paraphrase-multilingual-MiniLM-L12-v2
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"

      # Shared with phone-gateway so JWTs are mutually verifiable
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"

      # Default admin seeded into shared dashboard_users table
      CREATE_DEFAULT_ADMIN: "true"
      DEFAULT_ADMIN_NAME: "System Admin"
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      RESET_DEFAULT_ADMIN_PASSWORD: "false"

      # Service health probes used by /admin/system-status
      VAD_HEALTH_URL: "http://vad-service:8010/health"
      ASR_HEALTH_URL: "http://asr-service:8001/docs"
      TTS_HEALTH_URL: "http://tts-service:8000/docs"
      PHONE_GATEWAY_URL: "http://phone-gateway:8000/health"
      RAG_SERVICE_URL: "http://rag-service:8000"
      ESCALATION_SLA_HOURS: "48"
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

      DATA_DIR: "/app/data"
    volumes:
      - logic_data:/app/data
      - ./models:/models

volumes:
  postgres_data:
  call_recordings:
  pgadmin_data:
  vad_utterances:
  ollama_data:

  logic_data:
  minio_data:
