[global]
type=global
user_agent=FarmerAdvisorSIP

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; Development SIP endpoint for a softphone.
; Register as:
;   username: farmeruhamayohannes
;   password: change-me-dev-only
;   server:   localhost:5062 from the host, or sip-gateway:5060 from Docker
[farmeruhamayohannes-auth]
type=auth
auth_type=userpass
username=farmeruhamayohannes
password=change-me-dev-only

[farmeruhamayohannes]
type=aor
max_contacts=5
remove_existing=yes

[farmeruhamayohannes]
type=endpoint
context=from-sip
disallow=all
allow=g722
allow=slin16
allow=ulaw
allow=alaw
auth=farmeruhamayohannes-auth
aors=farmeruhamayohannes
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

; Optional unauthenticated inbound trunk template for controlled lab networks.
; Keep this disabled unless a trusted SIP trunk is pointed at the container.
; [inbound-trunk]
; type=endpoint
; context=from-sip
; disallow=all
; allow=ulaw
; allow=alaw
; direct_media=no
;
; [inbound-trunk-identify]
; type=identify
; endpoint=inbound-trunk
; match=10.0.0.0/8
